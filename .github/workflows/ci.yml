name: NovaPay CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Step 1: Detect which services changed ─────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      account:     ${{ steps.filter.outputs.account }}
      transaction: ${{ steps.filter.outputs.transaction }}
      ledger:      ${{ steps.filter.outputs.ledger }}
      fx:          ${{ steps.filter.outputs.fx }}
      payroll:     ${{ steps.filter.outputs.payroll }}
      admin:       ${{ steps.filter.outputs.admin }}
      infra:       ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            account:
              - 'services/account-service/**'
            transaction:
              - 'services/transaction-service/**'
            ledger:
              - 'services/ledger-service/**'
            fx:
              - 'services/fx-service/**'
            payroll:
              - 'services/payroll-service/**'
            admin:
              - 'services/admin-service/**'
            infra:
              - 'infra/**'

  # ─── Step 2: Test + Build only changed services ────────────────────────────
  account-service:
    name: Account Service — Test & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.account == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/account-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/account-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Get service version
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t account-service:${{ steps.version.outputs.VERSION }} .
          docker build -t account-service:latest .

      - name: Log in to registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/novapay-account-service"
          docker tag account-service:${{ steps.version.outputs.VERSION }} $IMAGE:${{ steps.version.outputs.VERSION }}
          docker tag account-service:latest $IMAGE:latest
          docker push $IMAGE:${{ steps.version.outputs.VERSION }}
          docker push $IMAGE:latest

  transaction-service:
    name: Transaction Service — Test & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.transaction == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/transaction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/transaction-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Get service version
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t transaction-service:${{ steps.version.outputs.VERSION }} .

      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  ledger-service:
    name: Ledger Service — Test & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/ledger-service/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
      - run: docker build -t ledger-service:${{ steps.version.outputs.VERSION }} .

  fx-service:
    name: FX Service — Test & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.fx == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fx-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/fx-service/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
      - run: docker build -t fx-service:${{ steps.version.outputs.VERSION }} .

  payroll-service:
    name: Payroll Service — Test & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.payroll == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payroll-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/payroll-service/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
      - run: docker build -t payroll-service:${{ steps.version.outputs.VERSION }} .

  admin-service:
    name: Admin Service — Test & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/admin-service/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
      - run: docker build -t admin-service:${{ steps.version.outputs.VERSION }} .

  # ─── Step 3: Gate — block merge if any job failed ──────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - account-service
      - transaction-service
      - ledger-service
      - fx-service
      - payroll-service
      - admin-service
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          if echo "$results" | grep -qE "failure|cancelled"; then
            echo "One or more service jobs failed — blocking merge"
            exit 1
          fi
          echo "All changed services passed — merge allowed"
