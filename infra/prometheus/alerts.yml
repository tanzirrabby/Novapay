groups:
  - name: novapay_critical
    rules:
      - alert: LedgerInvariantViolation
        expr: ledger_invariant_violations_total > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Ledger invariant violated — money created or destroyed"
          description: "ledger_invariant_violations_total={{ $value }}. Immediate investigation required."

      - alert: HighFailedTransactionRate
        expr: rate(transaction_failures_total[5m]) / rate(transaction_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Failed transaction rate above 5%"

      - alert: HighAPILatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p99 latency exceeds 2 seconds"
