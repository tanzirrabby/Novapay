events {
  worker_connections 4096;
}

http {
  upstream account_service    { server account-service:3001; }
  upstream transaction_service { server transaction-service:3002; }
  upstream ledger_service     { server ledger-service:3003; }
  upstream fx_service         { server fx-service:3004; }
  upstream payroll_service    { server payroll-service:3005; }
  upstream admin_service      { server admin-service:3006; }

  # Rate limiting: 1000 req/s per IP
  limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;

  log_format main '$remote_addr - $request_id [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';

  access_log /var/log/nginx/access.log main;

  server {
    listen 80;

    # Inject request ID for tracing
    add_header X-Request-ID $request_id always;

    location /health {
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }

    location /api/v1/accounts {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://account_service;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }

    location /api/v1/transactions {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://transaction_service;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }

    location /api/v1/transfers {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://transaction_service;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }

    location /api/v1/ledger {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://ledger_service;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/fx {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://fx_service;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/payroll {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://payroll_service;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    location /api/v1/admin {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://admin_service;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
